<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SarapNom - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="admin-dashboard.css">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="index.html" class="logo">  
                <i class="fas fa-utensils"></i>
                SarapNom
            </a>
        </div>
        <nav>
            <a href="index.html" class="nav-link active">
                <i class="fas fa-tachometer-alt"></i>
                <span>Dashboard</span>
            </a>
            <a href="orders.html" class="nav-link">
                <i class="fas fa-shopping-bag"></i>
                <span>Orders</span>
                <span class="badge bg-primary ms-auto" id="ordersBadge">12</span>
            </a>
            <a href="products.html" class="nav-link">
                <i class="fas fa-cookie-bite"></i>
                <span>Products</span>
            </a>
            <a href="customer.html" class="nav-link">
                <i class="fas fa-users"></i>
                <span>Customers</span>
            </a>
            <a href="settings.html" class="nav-link">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
        </nav>
    </div>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <!-- Top Navbar -->
        <header class="top-navbar">
            <div class="d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-3">
                    <button class="sidebar-toggle d-lg-none" id="sidebarToggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div>
                        <h1 class="page-title">Dashboard</h1>
                        <p class="page-subtitle">Welcome back, Admin!</p>
                    </div>
                </div>
                <div class="navbar-actions">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="Search...">
                    </div>
                    <div class="user-profile">
                        <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=40&h=40&fit=crop&crop=face" alt="Admin" class="avatar">
                        <div>
                            <div class="fw-600">Admin User</div>
                            <div class="text-muted small">Super Admin</div>
                        </div>
                        <i class="fas fa-chevron-down ms-2 text-muted"></i>
                    </div>
                </div>
            </div>
        </header>

        <!-- Content -->
        <main class="content">
            <div class="container-fluid">
                <!-- Stats -->
                <div class="stats-grid">
                    <div class="stat-card stat-primary">
                        <div class="stat-icon">
                            <i class="fas fa-shopping-bag"></i>
                        </div>
                        <div class="stat-number" data-stat="totalOrders">-</div>
                        <div class="stat-label">Total Orders</div>
                    </div>
                    <div class="stat-card stat-success">
                        <div class="stat-icon">
                            <i class="fas fa-peso-sign"></i>
                        </div>
                        <div class="stat-number" data-stat="revenue">-</div>
                        <div class="stat-label">Revenue</div>
                    </div>
                    <div class="stat-card stat-accent">
                        <div class="stat-icon">
                            <i class="fas fa-users"></i>
                        </div>
                        <div class="stat-number" data-stat="customers">-</div>
                        <div class="stat-label">Customers</div>
                    </div>
                    <div class="stat-card stat-info">
                        <div class="stat-icon">
                            <i class="fas fa-star"></i>
                        </div>
                        <div class="stat-number" data-stat="avgRating">-</div>
                        <div class="stat-label">Avg Rating</div>
                    </div>
                </div>

                <div class="row g-4">
                    <!-- Chart Card -->
                    <div class="col-lg-8">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title">Sales Overview</h5>
                            </div>
                            <div class="card-body p-0">
                                <div class="chart-container"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Top Products -->
                    <div class="col-lg-4">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title">Top Products</h5>
                            </div>
                            <div class="card-body">
                                <div class="product-item" data-product="1">
                                    <div class="d-flex align-items-center">
                                        <div class="product-icon">🍰</div>
                                        <div>
                                            <div class="fw-600">Mango Graham</div>
                                            <div class="text-muted small" data-sales="1">-</div>
                                        </div>
                                    </div>
                                    <div class="fw-600 text-primary" data-revenue="1">-</div>
                                </div>
                                <div class="product-item" data-product="2">
                                    <div class="d-flex align-items-center">
                                        <div class="product-icon">🍪</div>
                                        <div>
                                            <div class="fw-600">Dubai Cookies</div>
                                            <div class="text-muted small" data-sales="2">-</div>
                                        </div>
                                    </div>
                                    <div class="fw-600 text-primary" data-revenue="2">-</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Recent Orders -->
                <div class="row">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h5 class="card-title mb-0">Recent Orders</h5>
                                <div>
                                    <button class="btn btn-outline-primary btn-sm me-2 active" data-filter="all">All</button>
                                    <button class="btn btn-outline-primary btn-sm" data-filter="pending">Pending</button>
                                </div>
                            </div>
                            <div class="table-responsive">
                                <table class="table">
                                    <thead>
                                        <tr>
                                            <th data-sort="asc">Order ID</th>
                                            <th data-sort="asc">Customer</th>
                                            <th>Items</th>
                                            <th data-sort="asc">Amount</th>
                                            <th>Status</th>
                                            <th data-sort="asc">Date</th>
                                        </tr>
                                    </thead>
                                    <tbody id="recentOrders">
                                        <!-- Orders will be populated by JS -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add New Order Modal -->
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">New Order</h5>
                <button class="btn-close" type="button"></button>
            </div>
            <form class="modal-body needs-validation" novalidate>
                <div class="mb-3">
                    <label class="form-label">Customer Name</label>
                    <input type="text" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Items</label>
                    <input type="text" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Amount</label>
                    <input type="number" class="form-control" required>
                </div>
            </form>
            <div class="modal-footer">
                <button class="btn btn-outline-primary" type="button">Cancel</button>
                <button class="btn btn-primary" type="submit" form="orderForm">Save Order</button>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="chart.js"></script>
    <script src="admin.js"></script>
</body>
</html>
