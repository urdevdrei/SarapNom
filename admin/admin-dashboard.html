<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SarapNom - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ========================================
           COMPLETE SARAPNOM ADMIN CSS - INLINE
        ======================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        :root {
            --primary: #CF8BA3;     
            --secondary: #80ABD9;
            --accent: #b96b86;
            --dark: #2c3e50;
            --light: #f8f9fa;
            --white: #ffffff;
            --shadow: 0 10px 30px rgba(0,0,0,0.1);
            --sidebar-width: 280px;
        }

        /* ADMIN WRAPPER */
        .admin-wrapper {
            display: flex;
            min-height: 100vh;
            background: var(--light);
        }

        /* SIDEBAR */
        .sidebar {
            width: var(--sidebar-width);
            background: linear-gradient(180deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            z-index: 1000;
            transition: all 0.3s ease;
            overflow-y: auto;
            box-shadow: var(--shadow);
        }

        .sidebar-header {
            padding: 2rem 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 1.5rem;
            font-weight: 800;
            text-decoration: none;
            color: white;
        }

        .sidebar-brand i {
            font-size: 2rem;
        }

        .sidebar-menu {
            list-style: none;
            padding: 1rem 0;
        }

        .sidebar-menu li {
            margin-bottom: 0.25rem;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.5rem;
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 500;
            cursor: pointer;
        }

        .sidebar-link:hover,
        .sidebar-link.active {
            background: rgba(255,255,255,0.2);
            color: white;
            border-right: 4px solid var(--secondary);
            transform: translateX(5px);
        }

        .sidebar-link i {
            width: 20px;
            font-size: 1.2rem;
        }

        /* MAIN CONTENT */
        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            background: var(--light);
            min-height: 100vh;
        }

        .admin-header {
            background: white;
            padding: 1.5rem 2rem;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 0;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1.5rem;
            background: var(--light);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .user-profile:hover {
            background: var(--primary);
            color: white;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* DASHBOARD CONTAINER */
        .dashboard-container {
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* SECTION HEADER */
        .section-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-header h2 {
            font-size: clamp(2rem, 5vw, 2.5rem);
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 0.5rem;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section-subtitle {
            color: var(--dark);
            opacity: 0.7;
            font-size: 1.1rem;
            margin-top: 0.5rem;
        }

        /* STATS GRID */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: white;
            padding: 2.5rem 2rem;
            border-radius: 24px;
            box-shadow: var(--shadow);
            text-align: center;
            transition: all 0.3s ease;
            border-top: 4px solid var(--primary);
        }

        .stat-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
        }

        .stat-icon {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .stat-icon.sales { background: linear-gradient(45deg, var(--primary), var(--accent)); color: white; }
        .stat-icon.orders { background: linear-gradient(45deg, var(--secondary), #5a9bd4); color: white; }
        .stat-icon.customers { background: linear-gradient(45deg, #28a745, #20c997); color: white; }
        .stat-icon.products { background: linear-gradient(45deg, #ffc107, #ff8c00); color: #212529; }

        .stat-number {
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 0.5rem;
            line-height: 1;
        }

        .stat-label {
            color: var(--dark);
            font-weight: 500;
            opacity: 0.8;
            font-size: 1rem;
        }

        /* CONTENT GRID */
        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        /* TABLES */
        .table-container {
            background: white;
            border-radius: 24px;
            box-shadow: var(--shadow);
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .table-header {
            padding: 2rem;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .table-header h3 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--dark);
            margin: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 1.25rem 2rem;
            text-align: left;
            border-bottom: 1px solid #f8f9fa;
        }

        th {
            background: #f8f9fa;
            font-weight: 600;
            color: var(--dark);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        tr:hover {
            background: #f8f9fa;
        }

        /* STATUS BADGES */
        .status {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status.completed { background: #d4edda; color: #155724; }
        .status.pending { background: #fff3cd; color: #856404; }
        .status.cancelled { background: #f8d7da; color: #721c24; }
        .status.active { background: #d1ecf1; color: #0c5460; }
        .status.inactive { background: #f8d7da; color: #721c24; }

        /* ACTION BUTTONS */
        .action-btn {
            padding: 0.5rem 0.75rem;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            margin-right: 0.5rem;
            margin-bottom: 0.25rem;
            width: 36px;
            height: 36px;
            justify-content: center;
        }

        .btn-view { background: var(--secondary); color: white; }
        .btn-edit { background: var(--primary); color: white; }
        .btn-delete { background: #dc3545; color: white; }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            margin: 2rem;
            padding: 2.5rem;
            border-radius: 24px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            position: relative;
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #f0f0f0;
        }

        .modal-header h3 {
            color: var(--dark);
            font-size: 1.5rem;
            font-weight: 700;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #999;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .close-modal:hover {
            background: #f0f0f0;
            color: var(--dark);
        }

        /* FORMS */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .form-group {
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--dark);
            font-weight: 500;
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 1rem 1.25rem;
            border: 2px solid #f0f0f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(207, 139, 163, 0.1);
        }

        /* CTA BUTTON */
        .cta-button {
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(207, 139, 163, 0.3);
            margin-left: auto;
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(207, 139, 163, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-right: 1rem;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        /* PRODUCT IMAGE */
        .product-img {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid #f0f0f0;
        }

        /* SUCCESS MESSAGE */
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            border: 1px solid #c3e6cb;
            display: none;
        }

        /* CHECKBOX STYLING */
        .product-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* NEW CONFIRM & ALERT MODALS */
        .confirm-modal,
        .alert-modal {
            max-width: 500px;
        }

        .confirm-modal .modal-body,
        .alert-modal .modal-body {
            text-align: center;
            margin-bottom: 2rem;
        }

        .confirm-modal .modal-icon,
        .alert-modal .modal-icon {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 2.5rem;
        }

        .confirm-modal .modal-icon { 
            background: linear-gradient(45deg, #ffc107, #ff8c00); 
            color: #212529; 
        }

        .alert-modal .modal-icon.info { 
            background: linear-gradient(45deg, var(--secondary), #5a9bd4); 
            color: white; 
        }

        .alert-modal .modal-icon.success { 
            background: linear-gradient(45deg, #28a745, #20c997); 
            color: white; 
        }

        .confirm-modal .modal-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 1rem;
        }

        .confirm-modal .modal-message,
        .alert-modal .modal-message {
            color: var(--dark);
            opacity: 0.8;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-danger:hover {
            background: #c82333;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(220, 53, 69, 0.4);
        }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .content-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            
            .sidebar.active {
                transform: translateX(0);
            }
            
            .main-content {
                margin-left: 0;
            }
            
            .stats-grid {
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 1.5rem;
            }
            
            .table-header {
                flex-direction: column;
                gap: 1rem;
                align-items: stretch;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                margin: 1rem;
                padding: 2rem;
            }

            .action-btn {
                width: 32px;
                height: 32px;
                font-size: 0.8rem;
            }

            .modal-actions {
                flex-direction: column;
            }
        }

        @media (max-width: 480px) {
            .dashboard-container {
                padding: 1rem;
            }
            
            .admin-header {
                padding: 1rem;
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="admin-wrapper">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="#" class="sidebar-brand" onclick="loadPage('dashboard')">
                    <i class="fas fa-utensils"></i>
                    SarapNom Admin
                </a>
            </div>
            <ul class="sidebar-menu">
                <li><a href="#" class="sidebar-link active" onclick="loadPage('dashboard')"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="#" class="sidebar-link" onclick="loadPage('products')"><i class="fas fa-cookie-bite"></i> Products</a></li>
                <li><a href="#" class="sidebar-link" onclick="loadPage('orders')"><i class="fas fa-shopping-cart"></i> Orders</a></li>
                <li><a href="#" class="sidebar-link" onclick="loadPage('customers')"><i class="fas fa-users"></i> Customers</a></li>
                <li><a href="#" class="sidebar-link" onclick="loadPage('settings')"><i class="fas fa-cog"></i> Settings</a></li>
                <li><a href="#" class="sidebar-link" onclick="showLogoutConfirm()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </aside>

        <div class="main-content">
            <header class="admin-header">
                <div class="header-left">
                    <h1 id="pageTitle">Dashboard</h1>
                </div>
                <div class="header-right">
                    <div class="user-profile" onclick="showLogoutConfirm()">
                        <div class="user-avatar">AD</div>
                        <div>
                            <div style="font-weight: 600; font-size: 0.9rem;">Admin User</div>
                            <div style="font-size: 0.8rem; opacity: 0.7;">admin@sarapnom.com</div>
                        </div>
                    </div>
                </div>
            </header>

            <div class="dashboard-container">
                <div id="pageContent">
    
                </div>
            </div>
        </div>
    </div>


    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle"><i class="fas fa-edit"></i> Edit Product</h3>
                <button class="close-modal" onclick="closeEditModal()">&times;</button>
            </div>
            <div id="successMessage" class="success-message">
                <i class="fas fa-check-circle"></i> Product updated successfully!
            </div>
            <form id="editProductForm">
                <input type="hidden" id="editProductId">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Product Name</label>
                        <input type="text" id="editProductName" required>
                    </div>
                    <div class="form-group">
                        <label>Price (₱)</label>
                        <input type="number" id="editProductPrice" min="0" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Stock Quantity</label>
                        <input type="number" id="editProductStock" min="0" required>
                    </div>
                    <div class="form-group">
                        <label>Sales Amount</label>
                        <input type="number" id="editSalesAmount" min="0" required>
                    </div>
                </div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end; padding-top: 1rem; border-top: 2px solid #f0f0f0;">
                    <button type="button" class="btn-secondary" onclick="closeEditModal()">Cancel</button>
                    <button type="submit" class="cta-button">
                        <i class="fas fa-save"></i> Update Product
                    </button>
                </div>
            </form>
        </div>
    </div>


    <div id="confirmModal" class="modal confirm-modal">
        <div class="modal-content">
            <div class="modal-body">
                <div class="modal-icon">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                <div class="modal-title" id="confirmTitle">Confirm Action</div>
                <div class="modal-message" id="confirmMessage"></div>
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeConfirmModal()">Cancel</button>
                <button class="btn-danger" id="confirmBtn">Confirm</button>
            </div>
        </div>
    </div>

    <div id="alertModal" class="modal alert-modal">
        <div class="modal-content">
            <div class="modal-body">
                <div class="modal-icon info" id="alertIcon">
                    <i class="fas fa-info-circle"></i>
                </div>
                <div class="modal-title" id="alertTitle">Information</div>
                <div class="modal-message" id="alertMessage"></div>
            </div>
            <div class="modal-actions">
                <button class="cta-button" onclick="closeAlertModal()">OK</button>
            </div>
        </div>
    </div>

    <script>
       
        let products = [
            { id: 1, name: 'Mango Graham Cake', price: 850, stock: 23, sales: 45, status: 'active', image: 'https://via.placeholder.com/50x50/CF8BA3/fff?text=Cake', category: 'Cakes' },
            { id: 2, name: 'Dubai Chewy Cookies', price: 450, stock: 67, sales: 32, status: 'active', image: 'https://via.placeholder.com/50x50/80ABD9/fff?text=Cookie', category: 'Cookies' },
            { id: 3, name: 'Ube Leche Flan', price: 120, stock: 15, sales: 78, status: 'active', image: 'https://via.placeholder.com/50x50/8B008B/fff?text=Flan', category: 'Desserts' },
        ];

   
        const topProducts = [
            { id: 1, name: 'Mango Graham Cake', sales: 18500 },
            { id: 2, name: 'Dubai Chewy Cookies', sales: 12300 }
        ];


        let confirmCallback = null;

        const pages = {
            dashboard: `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon sales"><i class="fas fa-dollar-sign"></i></div>
                        <div class="stat-number">₱<span id="totalSales">0</span></div>
                        <div class="stat-label">Total Sales</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon orders"><i class="fas fa-shopping-bag"></i></div>
                        <div class="stat-number"><span id="totalOrders">0</span></div>
                        <div class="stat-label">Total Orders</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon customers"><i class="fas fa-users"></i></div>
                        <div class="stat-number"><span id="totalCustomers">0</span></div>
                        <div class="stat-label">Customers</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon products"><i class="fas fa-cookie-bite"></i></div>
                        <div class="stat-number"><span id="totalProducts">0</span></div>
                        <div class="stat-label">Products</div>
                    </div>
                </div>

                <div class="content-grid">
                    <div class="table-container">
                        <div class="table-header">
                            <h3><i class="fas fa-shopping-cart"></i> Recent Orders</h3>
                        </div>
                        <table>
                            <thead>
                                <tr><th>Order ID</th><th>Customer</th><th>Product</th><th>Date</th><th>Amount</th><th>Status</th><th>Action</th></tr>
                            </thead>

        function showConfirm(title, message, callback) {
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmMessage').textContent = message;
            document.getElementById('confirmModal').classList.add('active');
            confirmCallback = callback;
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.remove('active');
            confirmCallback = null;
        }

        function confirmAction() {
            if (confirmCallback) {
                confirmCallback();
            }
            closeConfirmModal();
        }

        function showAlert(title, message, type = 'info') {
            document.getElementById('alertTitle').textContent = title;
            document.getElementById('alertMessage').textContent = message;
            
            const iconEl = document.getElementById('alertIcon');
            iconEl.className = `modal-icon ${type}`;
            
            if (type === 'success') {
                iconEl.innerHTML = '<i class="fas fa-check-circle"></i>';
            } else if (type === 'info') {
                iconEl.innerHTML = '<i class="fas fa-info-circle"></i>';
            }
            
            document.getElementById('alertModal').classList.add('active');
        }

        function closeAlertModal() {
            document.getElementById('alertModal').classList.remove('active');
        }

        function showLogoutConfirm() {
            showConfirm('Logout Confirmation', 'Are you sure you want to logout?', function() {
                showAlert('Logged Out', 'You have been logged out successfully! (Demo mode)', 'success');
            });
        }

      
        function renderProductsTable() {
            const tbody = document.getElementById('productsTableBody');
            const countEl = document.getElementById('productsCount');
            if (!tbody || !countEl) return;

            tbody.innerHTML = products.map(product => `
                <tr>
                    <td><input type="checkbox" class="product-checkbox" data-id="${product.id}"></td>
                    <td><img src="${product.image}" class="product-img" alt="${product.name}" onerror="this.src='https://via.placeholder.com/50x50/ddd/fff?text=?';"></td>
                    <td>${product.name}</td>
                    <td>₱${product.price.toLocaleString()}</td>
                    <td>${product.stock}</td>
                    <td>${product.sales}</td>
                    <td><span class="status ${product.status}">${product.status.charAt(0).toUpperCase() + product.status.slice(1)}</span></td>
                    <td>
                        <a href="#" class="action-btn btn-view" onclick="viewProduct(${product.id}); return false;" title="View">
                            <i class="fas fa-eye"></i>
                        </a>
                        <a href="#" class="action-btn btn-edit" onclick="editProduct(${product.id}); return false;" title="Edit">
                            <i class="fas fa-edit"></i>
                        </a>
                        <a href="#" class="action-btn btn-delete" onclick="deleteProduct(${product.id}); return false;" title="Delete">
                            <i class="fas fa-trash"></i>
                        </a>
                    </td>
                </tr>
            `).join('');

            countEl.textContent = products.length;
        }

 
        function handleAddProduct(e) {
            e.preventDefault();
            
            const newProduct = {
                id: Date.now(),
                name: document.getElementById('newProductName').value,
                price: parseFloat(document.getElementById('newProductPrice').value),
                stock: parseInt(document.getElementById('newProductStock').value),
                category: document.getElementById('newProductCategory').value,
                description: document.getElementById('newProductDesc').value || '',
                sales: 0,
                status: 'active',
                image: `https://via.placeholder.com/50x50/${Math.floor(Math.random()*16777215).toString(16)}/fff?text=${encodeURIComponent(document.getElementById('newProductName').value.substring(0,3))}`
            };

            products.unshift(newProduct);
            renderProductsTable();
            updateDashboardStats();
            
            showAlert('Success', '✅ Product added successfully!', 'success');
            resetAddForm();
        }

        function resetAddForm() {
            document.getElementById('addProductForm').reset();
            document.getElementById('newProductCategory').value = 'Cakes';
        }

   
        function editProduct(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            document.getElementById('editProductId').value = product.id;
            document.getElementById('editProductName').value = product.name;
            document.getElementById('editProductPrice').value = product.price;
            document.getElementById('editProductStock').value = product.stock;
            document.getElementById('editSalesAmount').value = product.sales;
            
            document.getElementById('modalTitle').innerHTML = 
                `<i class="fas fa-edit"></i> Edit ${product.name}`;
            
            document.getElementById('editModal').classList.add('active');
        }


        function deleteProduct(productId) {
            const product = products.find(p => p.id === productId);
            showConfirm(
                'Delete Product', 
                `Are you sure you want to delete "${product.name}"? This action cannot be undone.`,
                function() {
                    products = products.filter(p => p.id !== productId);
                    renderProductsTable();
                    updateDashboardStats();
                    showAlert('Deleted', '🗑️ Product deleted successfully!', 'success');
                }
            );
        }

        function deleteSelectedProducts() {
            const checkboxes = document.querySelectorAll('.product-checkbox:checked');
            if (checkboxes.length === 0) {
                showAlert('No Selection', 'Please select products to delete.', 'info');
                return;
            }

            showConfirm(
                'Delete Multiple Products',
                `Delete ${checkboxes.length} selected product(s)? This cannot be undone.`,
                function() {
                    const selectedIds = Array.from(checkboxes).map(cb => parseInt(cb.dataset.id));
                    products = products.filter(p => !selectedIds.includes(p.id));
                    renderProductsTable();
                    updateDashboardStats();
                    showAlert('Deleted', `${checkboxes.length} product(s) deleted successfully!`, 'success');
                }
            );
        }


        function toggleSelectAll() {
            const selectAll = document.getElementById('selectAll');
            const checkboxes = document.querySelectorAll('.product-checkbox');
            
            checkboxes.forEach(cb => cb.checked = selectAll.checked);
        }

        function viewProduct(productId) {
            const product = products.find(p => p.id === productId);
            if (product) {
                const details = `🍰 Product Details:

📦 Name: ${product.name}
💰 Price: ₱${product.price.toLocaleString()}
📊 Stock: ${product.stock}
🔥 Sales: ${product.sales}
🏷️ Status: ${product.status.toUpperCase()}
📂 Category: ${product.category}`;
                
                showAlert('Product Details', details, 'info');
            }
        }


        function updateDashboardStats() {
            const totalSales = products.reduce((sum, p) => sum + (p.price * p.sales), 0);
            const totalProducts = products.length;
            
            document.getElementById('totalSales') && (document.getElementById('totalSales').textContent = totalSales.toLocaleString());
            document.getElementById('totalProducts') && (document.getElementById('totalProducts').textContent = totalProducts);
        }

     
        function renderTopProducts() {
            const tbody = document.getElementById('topProductsBody');
            if (!tbody) return;

            tbody.innerHTML = topProducts.map(product => `
                <tr>
                    <td>${product.name}</td>
                    <td>₱${product.sales.toLocaleString()}</td>
                    <td>
                        <a href="#" class="action-btn btn-edit" onclick="editTopProduct(${product.id}); return false;" title="Edit">
                            <i class="fas fa-edit"></i>
                        </a>
                    </td>
                </tr>
            `).join('');
        }

     
        function showSuccessMessage(message) {
            const successMsg = document.getElementById('successMessage');
            if (successMsg) {
                successMsg.innerHTML = message;
                successMsg.style.display = 'block';
                setTimeout(() => successMsg.style.display = 'none', 3000);
            } else {
                
                const tempMsg = document.createElement('div');
                tempMsg.className = 'success-message';
                tempMsg.innerHTML = message;
                tempMsg.style.cssText = 'position:fixed;top:20px;right:20px;z-index:3000;max-width:400px;';
                document.body.appendChild(tempMsg);
                setTimeout(() => tempMsg.remove(), 3000);
            }
        }


        document.addEventListener('DOMContentLoaded', function() {
           
            document.getElementById('editProductForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const productId = parseInt(document.getElementById('editProductId').value);
                const productIndex = products.findIndex(p => p.id === productId);
                
                if (productIndex !== -1) {
                    products[productIndex].name = document.getElementById('editProductName').value;
                    products[productIndex].price = parseFloat(document.getElementById('editProductPrice').value);
                    products[productIndex].stock = parseInt(document.getElementById('editProductStock').value);
                    products[productIndex].sales = parseInt(document.getElementById('editSalesAmount').value);
                    
                    renderProductsTable();
                    renderTopProducts();
                    updateDashboardStats();
                    
                    showSuccessMessage('✅ Product updated successfully!');
                    setTimeout(closeEditModal, 2000);
                }
            });

       
            document.addEventListener('submit', function(e) {
                if (e.target.id === 'addProductForm') {
                    handleAddProduct(e);
                }
            });

            document.getElementById('editModal').addEventListener('click', function(e) {
                if (e.target === this) closeEditModal();
            });

            document.getElementById('confirmModal').addEventListener('click', function(e) {
                if (e.target === this) closeConfirmModal();
            });

            document.getElementById('alertModal').addEventListener('click', function(e) {
                if (e.target === this) closeAlertModal();
            });

  
            document.getElementById('confirmBtn').onclick = confirmAction;
        });

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            document.getElementById('editProductForm').reset();
        }


        function editTopProduct(productId) {
     
            const product = products.find(p => p.id === productId);
            if (!product) return;

            document.getElementById('editProductId').value = product.id;
            document.getElementById('editProductName').value = product.name;
            document.getElementById('editProductPrice').value = product.price;
            document.getElementById('editProductStock').value = product.stock;
            document.getElementById('editSalesAmount').value = product.sales;
            
            document.getElementById('editModal').classList.add('active');
        }

        function loadPage(pageName) {
            document.getElementById('pageTitle').textContent = 
                pageName.charAt(0).toUpperCase() + pageName.slice(1);
            document.getElementById('pageContent').innerHTML = pages[pageName];
            

            document.querySelectorAll('.sidebar-link').forEach(link => 
                link.classList.remove('active')
            );
            event.target.closest('.sidebar-link').classList.add('active');

            setTimeout(() => {
                if (pageName === 'dashboard') {
                    renderTopProducts();
                    updateDashboardStats();
                } else if (pageName === 'products') {
                    renderProductsTable();
                }
            }, 100);
            
            window.scrollTo(0, 0);
        }

        window.onload = () => {
            loadPage('dashboard');
            updateDashboardStats();
        };
    </script>
