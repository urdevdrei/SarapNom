<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SarapNom - Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin-dashboard.css">
    <style>
        /* Products-specific styles */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .product-card {
            border: 2px solid var(--gray-200);
            transition: all 0.3s ease;
            cursor: pointer;
            overflow: hidden;
            position: relative;
        }
        
        .product-card:hover {
            border-color: var(--primary);
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
        }
        
        .product-image {
            height: 200px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            position: relative;
            overflow: hidden;
        }
        
        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .product-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            padding: 0.375rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .badge-out-of-stock {
            background: #fee2e2;
            color: #ef4444;
        }
        
        .badge-low-stock {
            background: #fef3c7;
            color: var(--accent);
        }
        
        .product-info {
            padding: 1.5rem;
        }
        
        .product-price {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }
        
        .stock-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }
        
        .stock-in-stock { color: var(--secondary); }
        .stock-low { color: var(--accent); }
        .stock-out { color: #ef4444; }
        
        .product-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        
        .bulk-actions {
            background: var(--gray-100);
            padding: 1rem;
            border-radius: var(--border-radius);
            margin-bottom: 2rem;
        }
        
        .category-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }
        
        .category-tag {
            padding: 0.25rem 0.75rem;
            background: var(--gray-200);
            color: var(--gray-700);
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }
        
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--gray-300);
            transition: 0.3s;
            border-radius: 26px;
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }
        
        input:checked + .slider {
            background-color: var(--secondary);
        }
        
        input:checked + .slider:before {
            transform: translateX(24px);
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="index.html" class="logo">  
                <i class="fas fa-utensils"></i>
                SarapNom
            </a>
        </div>
        <nav>
            <a href="index.html" class="nav-link">
                <i class="fas fa-tachometer-alt"></i>
                <span>Dashboard</span>
            </a>
            <a href="orders.html" class="nav-link">
                <i class="fas fa-shopping-bag"></i>
                <span>Orders</span>
            </a>
            <a href="products.html" class="nav-link active">
                <i class="fas fa-cookie-bite"></i>
                <span>Products</span>
            </a>
            <a href="customer.html" class="nav-link">
                <i class="fas fa-users"></i>
                <span>Customers</span>
            </a>
            <a href="settings.html" class="nav-link">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
        </nav>
    </div>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <!-- Top Navbar -->
        <header class="top-navbar">
            <div class="d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-3">
                    <button class="sidebar-toggle d-lg-none" id="sidebarToggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div>
                        <h1 class="page-title">Products</h1>
                        <p class="page-subtitle">Manage your dessert inventory</p>
                    </div>
                </div>
                <div class="navbar-actions">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="Search products..." id="productSearch">
                    </div>
                    <div class="user-profile">
                        <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=40&h=40&fit=crop&crop=face" alt="Admin" class="avatar">
                        <div>
                            <div class="fw-600">Admin User</div>
                            <div class="text-muted small">Super Admin</div>
                        </div>
                        <i class="fas fa-chevron-down ms-2 text-muted"></i>
                    </div>
                </div>
            </div>
        </header>

        <!-- Content -->
        <main class="content">
            <div class="container-fluid">
                <!-- Product Stats -->
                <div class="stats-row">
                    <div class="stat-card stat-primary">
                        <div class="stat-icon">
                            <i class="fas fa-cookie-bite"></i>
                        </div>
                        <div class="stat-number">0</div>
                        <div class="stat-label">Total Products</div>
                    </div>
                    <div class="stat-card stat-success">
                        <div class="stat-icon">
                            <i class="fas fa-check-circle"></i>
                        </div>
                        <div class="stat-number">0</div>
                        <div class="stat-label">In Stock</div>
                    </div>
                    <div class="stat-card stat-accent">
                        <div class="stat-icon">
                            <i class="fas fa-exclamation-triangle"></i>
                        </div>
                        <div class="stat-number">0</div>
                        <div class="stat-label">Low Stock</div>
                    </div>
                    <div class="stat-card stat-info">
                        <div class="stat-icon">
                            <i class="fas fa-fire"></i>
                        </div>
                        <div class="stat-number">0</div>
                        <div class="stat-label">Top Sellers</div>
                    </div>
                </div>

                <!-- Bulk Actions & Filters -->
                <div class="bulk-actions d-flex justify-content-between align-items-center flex-wrap gap-3">
                    <div class="d-flex gap-2">
                        <div class="d-flex align-items-center gap-2">
                            <input type="checkbox" id="selectAllProducts">
                            <label for="selectAllProducts" class="mb-0 fw-500">Select All</label>
                        </div>
                        <button class="btn btn-outline-danger btn-sm" id="bulkDelete">
                            <i class="fas fa-trash me-1"></i>Delete
                        </button>
                        <button class="btn btn-outline-warning btn-sm" id="bulkOutOfStock">
                            <i class="fas fa-ban me-1"></i>Out of Stock
                        </button>
                    </div>
                    <div class="d-flex gap-2 flex-wrap">
                        <select class="form-select form-select-sm" style="min-width: 150px;">
                            <option>All Categories</option>
                            <option>Cakes</option>
                            <option>Cookies</option>
                            <option>Pastries</option>
                            <option>Drinks</option>
                        </select>
                        <select class="form-select form-select-sm" style="min-width: 120px;">
                            <option>All Status</option>
                            <option>Active</option>
                            <option>Inactive</option>
                            <option>Out of Stock</option>
                        </select>
                        <button class="btn btn-outline-primary btn-sm" id="toggleView">
                            <i class="fas fa-th-large me-1"></i>Grid
                            <i class="fas fa-list ms-1 d-none"></i>
                        </button>
                    </div>
                </div>

                <!-- Products Grid -->
                <div class="product-grid" id="productsGrid">
                    <!-- Products populated by JS -->
                </div>

                <!-- Add Product Button (Floating) -->
                <button class="btn btn-primary position-fixed bottom-0 end-0 m-4 shadow-lg" 
                        style="width: 56px; height: 56px; border-radius: 50%; z-index: 1000; font-size: 1.25rem;"
                        data-bs-toggle="modal" data-bs-target="#productModal">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
        </main>
    </div>

    <!-- Product Modal -->
    <div class="modal fade" id="productModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-cookie-bite me-2 text-primary"></i>
                        <span id="modalProductTitle">Add New Product</span>
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="productForm" class="needs-validation" novalidate>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label class="form-label">Product Image</label>
                                    <div class="product-image mb-2 text-center p-4 bg-gradient">
                                        <i class="fas fa-cookie-bite" style="font-size: 3rem; opacity: 0.5;"></i>
                                        <input type="file" class="form-control mt-2 d-none" id="productImage" accept="image/*">
                                        <button type="button" class="btn btn-outline-primary btn-sm mt-2" onclick="document.getElementById('productImage').click()">
                                            Choose Image
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-8">
                                <div class="row">
                                    <div class="col-md-8 mb-3">
                                        <label class="form-label">Product Name *</label>
                                        <input type="text" class="form-control" id="productName" required>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <label class="form-label">Category</label>
                                        <select class="form-select" id="productCategory">
                                            <option>Cakes</option>
                                            <option>Cookies</option>
                                            <option>Pastries</option>
                                            <option>Drinks</option>
                                            <option>Others</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Price (₱) *</label>
                                        <input type="number" class="form-control" id="productPrice" step="0.01" min="0" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Stock Quantity</label>
                                        <input type="number" class="form-control" id="productStock" min="0">
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Status</label>
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" id="productStatus" checked>
                                            <label class="form-check-label" for="productStatus">Active</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Featured</label>
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" id="productFeatured">
                                            <label class="form-check-label" for="productFeatured">Show on homepage</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Description</label>
                                    <textarea class="form-control" id="productDescription" rows="3" placeholder="Delicious mango graham cake with creamy layers..."></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-1"></i>
                            Save Product
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="products.js"></script>
</body>
</html>
