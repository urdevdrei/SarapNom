<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SarapNom - Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin-dashboard.css">
    <style>
        /* Additional Orders-specific styles */
        .order-actions {
            display: flex;
            gap: 0.5rem;
        }
        
        .order-item {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        
        .order-item:hover {
            background-color: var(--gray-100);
            transform: translateX(4px);
        }
        
        .order-status {
            padding: 0.5rem 1rem;
            border-radius: 25px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .status-pending { background: #fef3c7; color: var(--accent); }
        .status-confirmed { background: #dcfce7; color: var(--secondary); }
        .status-preparing { background: #dbeafe; color: var(--info); }
        .status-ready { background: #e0e7ff; color: #6366f1; }
        .status-delivered { background: #d1fae5; color: #059669; }
        .status-cancelled { background: #fee2e2; color: #ef4444; }
        
        .payment-status {
            padding: 0.375rem 0.75rem;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .payment-paid { background: #dcfce7; color: var(--secondary); }
        .payment-pending { background: #fef3c7; color: var(--accent); }
        
        .filter-tabs {
            border-bottom: 2px solid var(--gray-200);
            margin-bottom: 2rem;
        }
        
        .filter-tab {
            padding: 1rem 2rem;
            border: none;
            background: none;
            color: var(--gray-600);
            font-weight: 500;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }
        
        .filter-tab.active {
            color: var(--primary);
        }
        
        .filter-tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 3px;
            background: var(--primary);
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <!-- Sidebar (same as dashboard) -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="admin-dashboard.html" class="logo">  
                <i class="fas fa-utensils"></i>
                SarapNom
            </a>
        </div>
        <nav>
            <a href="admin-dashboard.html" class="nav-link">
                <i class="fas fa-tachometer-alt"></i>
                <span>Dashboard</span>
            </a>
            <a href="orders.html" class="nav-link active">
                <i class="fas fa-shopping-bag"></i>
                <span>Orders</span>
                <span class="badge bg-primary ms-auto" id="ordersBadge"></span>
            </a>
            <a href="products.html" class="nav-link">
                <i class="fas fa-cookie-bite"></i>
                <span>Products</span>
            </a>
            <a href="customer.html" class="nav-link">
                <i class="fas fa-users"></i>
                <span>Customers</span>
            </a>
            <a href="settings.html" class="nav-link">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
        </nav>
    </div>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <!-- Top Navbar -->
        <header class="top-navbar">
            <div class="d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-3">
                    <button class="sidebar-toggle d-lg-none" id="sidebarToggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div>
                        <h1 class="page-title">Orders</h1>
                        <p class="page-subtitle">Manage all customer orders</p>
                    </div>
                </div>
                <div class="navbar-actions">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="Search orders..." id="ordersSearch">
                    </div>
                    <div class="user-profile">
                        <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=40&h=40&fit=crop&crop=face" alt="Admin" class="avatar">
                        <div>
                            <div class="fw-600">Admin User</div>
                            <div class="text-muted small">Super Admin</div>
                        </div>
                        <i class="fas fa-chevron-down ms-2 text-muted"></i>
                    </div>
                </div>
            </div>
        </header>

        <!-- Content -->
        <main class="content">
            <div class="container-fluid">
                <!-- Orders Stats -->
                <div class="stats-grid mb-4">
                    <div class="stat-card stat-primary">
                        <div class="stat-icon">
                            <i class="fas fa-shopping-bag"></i>
                        </div>
                        <div class="stat-number" data-stat="totalOrders">0</div>
                        <div class="stat-label">Total Orders</div>
                    </div>
                    <div class="stat-card stat-success">
                        <div class="stat-icon">
                            <i class="fas fa-check-circle"></i>
                        </div>
                        <div class="stat-number" data-stat="completedOrders">0</div>
                        <div class="stat-label">Completed</div>
                    </div>
                    <div class="stat-card stat-accent">
                        <div class="stat-icon">
                            <i class="fas fa-clock"></i>
                        </div>
                        <div class="stat-number" data-stat="pendingOrders">0</div>
                        <div class="stat-label">Pending</div>
                    </div>
                    <div class="stat-card stat-info">
                        <div class="stat-icon">
                            <i class="fas fa-chart-line"></i>
                        </div>
                        <div class="stat-number" data-stat="avgOrderValue">₱0</div>
                        <div class="stat-label">Avg Order</div>
                    </div>
                </div>

                <!-- Filter Tabs -->
                <div class="filter-tabs">
                    <button class="filter-tab active" data-filter="all">
                        <i class="fas fa-list me-2"></i>All Orders
                    </button>
                    <button class="filter-tab" data-filter="pending">
                        <i class="fas fa-clock me-2"></i>Pending 
                    </button>
                    <button class="filter-tab" data-filter="confirmed">
                        <i class="fas fa-check-circle me-2"></i>Confirmed 
                    </button>
                    <button class="filter-tab" data-filter="preparing">
                        <i class="fas fa-fire me-2"></i>Preparing 
                    </button>
                    <button class="filter-tab" data-filter="delivered">
                        <i class="fas fa-truck me-2"></i>Delivered 
                    </button>
                </div>

                <!-- Orders Table -->
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0">Order List</h5>
                        <div class="d-flex gap-2">
                            <button class="btn btn-outline-primary btn-sm" id="exportBtn">
                                <i class="fas fa-download me-1"></i>Export
                            </button>
                            <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#orderModal">
                                <i class="fas fa-plus me-1"></i>New Order
                            </button>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th><input type="checkbox" id="selectAll"></th>
                                    <th data-sort="asc">Order ID</th>
                                    <th data-sort="asc">Customer</th>
                                    <th>Items</th>
                                    <th data-sort="asc">Amount</th>
                                    <th>Payment</th>
                                    <th>Status</th>
                                    <th data-sort="asc">Date</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="ordersTable">
                                <!-- Orders populated by JS -->
                            </tbody>
                        </table>
                    </div>
                    <!-- Pagination -->
                    <div class="card-footer d-flex justify-content-between align-items-center">
                        <div class="text-muted small">
                            Showing 1-10 of 124 orders
                        </div>
                        <nav>
                            <ul class="pagination mb-0">
                                <li class="page-item">
                                    <a class="page-link" href="#"><i class="fas fa-chevron-left"></i></a>
                                </li>
                                <li class="page-item active"><a class="page-link" href="#">1</a></li>
                                <li class="page-item"><a class="page-link" href="#">2</a></li>
                                <li class="page-item"><a class="page-link" href="#">3</a></li>
                                <li class="page-item"><a class="page-link" href="#"><i class="fas fa-chevron-right"></i></a></li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </main>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="data.js"></script>
    <script src="orders.js"></script>
</body>
</html>
